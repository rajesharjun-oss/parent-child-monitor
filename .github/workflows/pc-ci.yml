name: Windows PC app

on:
  push:
    paths:
      - "pc/**"
      - "global.json"
      - ".github/workflows/pc-ci.yml"
  pull_request:
    paths:
      - "pc/**"
      - "global.json"
      - ".github/workflows/pc-ci.yml"

permissions:
  contents: read

jobs:
  build-test-publish:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.402"
          cache: true
          cache-dependency-path: "pc/**/packages.lock.json"

      - name: Restore locked dependencies
        shell: pwsh
        run: |
          dotnet restore pc/src/ChildScreenTime.Windows/ChildScreenTime.Windows.csproj --runtime win-x64 --locked-mode --configfile pc/NuGet.config
          dotnet restore pc/src/ChildScreenTime.Service/ChildScreenTime.Service.csproj --runtime win-x64 --locked-mode --configfile pc/NuGet.config
          dotnet restore pc/tests/ChildScreenTime.Core.Tests/ChildScreenTime.Core.Tests.csproj --locked-mode --configfile pc/NuGet.config
          dotnet restore pc/tests/ChildScreenTime.Windows.Tests/ChildScreenTime.Windows.Tests.csproj --locked-mode --configfile pc/NuGet.config

      - name: Build
        shell: pwsh
        run: |
          dotnet build pc/src/ChildScreenTime.Windows/ChildScreenTime.Windows.csproj --configuration Release --no-restore
          dotnet build pc/src/ChildScreenTime.Service/ChildScreenTime.Service.csproj --configuration Release --no-restore

      - name: Test
        shell: pwsh
        run: |
          dotnet test pc/tests/ChildScreenTime.Core.Tests/ChildScreenTime.Core.Tests.csproj --configuration Release --no-restore
          dotnet test pc/tests/ChildScreenTime.Windows.Tests/ChildScreenTime.Windows.Tests.csproj --configuration Release --no-restore

      - name: Publish self-contained application and service
        shell: pwsh
        run: |
          dotnet publish pc/src/ChildScreenTime.Windows/ChildScreenTime.Windows.csproj --configuration Release --runtime win-x64 --self-contained true --no-restore -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -p:DebugSymbols=false --output pc/artifacts/publish
          dotnet publish pc/src/ChildScreenTime.Service/ChildScreenTime.Service.csproj --configuration Release --runtime win-x64 --self-contained true --no-restore -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -p:DebugSymbols=false --output pc/artifacts/service-publish
          Copy-Item -LiteralPath pc/artifacts/service-publish/ChildScreenTime.Service.exe -Destination pc/artifacts/publish -Force

      - name: Upload application
        uses: actions/upload-artifact@v4
        with:
          name: child-screen-time-windows
          path: pc/artifacts/publish
          if-no-files-found: error
